<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b63">
<meta name="robots" content="noindex,nofollow">
<title>Salama Check-In</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#17211f;--muted:#5a6a66;--line:#d9e1de;--brand:#0f6b63;--brand-ink:#fff;--brand-soft:#e1f1ee;
  --g:#2f855a;--g-soft:#e3f4ea;--y:#8a6a00;--y-soft:#fbf1cf;--o:#b45309;--o-soft:#fde8d0;--r:#b42318;--r-soft:#fde4e1;--focus:#1d4ed8;--radius:14px}
@media (prefers-color-scheme: dark){:root{--bg:#0e1514;--card:#16201e;--ink:#e8f0ee;--muted:#9db0ab;--line:#2a3a37;--brand:#3fb5a7;--brand-ink:#06201d;--brand-soft:#16302c;
  --g:#6fd3a0;--g-soft:#143323;--y:#f0c94a;--y-soft:#3a3010;--o:#f4a25a;--o-soft:#3b2410;--r:#ff8a7d;--r-soft:#401a16;--focus:#8ab4ff}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
header.top .logo{font-weight:700;font-size:1.05rem;flex:1}header.top .logo small{display:block;font-weight:400;font-size:.72rem;opacity:.85}
button,.btn{font:inherit;cursor:pointer}
.exit{background:rgba(255,255,255,.16);color:inherit;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 14px;font-weight:600}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
.demo{background:var(--y-soft);color:var(--y);font-size:.85rem;padding:6px 16px;text-align:center}
h1{font-size:1.45rem;line-height:1.25;margin:.2em 0 .4em}h2{font-size:1.15rem;margin:1.2em 0 .4em}p{margin:.4em 0 .8em}
.muted{color:var(--muted)}.small{font-size:.86rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:380px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;color:inherit;min-height:104px;display:flex;flex-direction:column;gap:4px}
.tile b{font-size:1.02rem}.tile .ic{font-size:1.4rem;line-height:1}
.tile.primary{grid-column:1/-1;background:var(--brand);color:var(--brand-ink);border-color:var(--brand);min-height:0}.tile.primary .muted{color:inherit;opacity:.92}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:12px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:650}
.btn.secondary{background:transparent;color:var(--brand)}.btn.danger{background:var(--r);border-color:var(--r);color:#fff}.btn.block{display:flex;width:100%}.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
fieldset{border:0;margin:0 0 18px;padding:0}legend{font-weight:600;padding:0;margin-bottom:8px}
.opts{display:grid;gap:8px}.opts.grid11{grid-template-columns:repeat(6,1fr)}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;min-height:48px;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--brand);flex:none;margin:0}.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opts.grid11 .opt{flex-direction:column;justify-content:center;text-align:center;gap:4px;padding:8px 4px;font-size:.9rem}
.err{border-left:4px solid var(--r);padding-left:10px}.errmsg{color:var(--r);font-weight:600;margin:6px 0}
textarea,select,input[type=text],input[type=tel]{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 14px}.progress>i{display:block;height:100%;background:var(--brand)}
.stepper{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem}
.zone{border-radius:var(--radius);padding:18px;border:2px solid;margin:10px 0}.zone h1{margin:0 0 .2em}
.zone.z1{background:var(--g-soft);border-color:var(--g)}.zone.z2{background:var(--y-soft);border-color:var(--y)}.zone.z3{background:var(--o-soft);border-color:var(--o)}.zone.z4{background:var(--r-soft);border-color:var(--r)}
.zonebar{display:flex;gap:4px;margin:10px 0 0}.zonebar span{flex:1;text-align:center;font-size:.72rem;padding:4px 2px;border-radius:6px;background:var(--line);color:var(--muted)}
.zonebar span.on{color:#fff;font-weight:700}.zonebar .b1.on{background:var(--g)}.zonebar .b2.on{background:var(--y)}.zonebar .b3.on{background:var(--o)}.zonebar .b4.on{background:var(--r)}
.safety{background:var(--r-soft);border:2px solid var(--r);border-radius:var(--radius);padding:14px;margin:12px 0}
.line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.line:first-child{border-top:0}
.line a{font-weight:700;color:var(--brand);text-decoration:none;white-space:nowrap}
.banner{background:var(--brand-soft);border:1px solid var(--brand);border-radius:var(--radius);padding:12px 14px;margin:10px 0}
table.scores{width:100%;border-collapse:collapse;font-size:.92rem}table.scores td{padding:6px 0;border-top:1px solid var(--line)}table.scores td:last-child{text-align:right;font-weight:650}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.link{background:none;border:0;color:var(--brand);text-decoration:underline;padding:6px 0;font-weight:600;text-align:left}
footer.fine{max-width:640px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.8rem}
.back{background:none;border:0;color:var(--brand);font-weight:650;padding:6px 0;margin-bottom:4px}
ul.clean,ol.clean{padding-left:1.15em;margin:.3em 0 .8em}ul.clean li,ol.clean li{margin:.4em 0}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:650;background:var(--brand-soft);color:var(--brand)}
.neutral{max-width:640px;margin:60px auto;padding:16px;font-family:Georgia,serif}
</style>
</head>
<body>
<div id="demo" class="demo" hidden>Demo mode: nothing leaves this device. The nurse console and exports work in this browser only.</div>
<header class="top"><div class="logo">Salama Check-In<small>Private. Screening, not diagnosis.</small></div>
  <button class="exit" id="exitBtn" aria-label="Quick exit: leave this page now">Quick exit</button></header>
<main id="app" tabindex="-1"><noscript>This app needs JavaScript.</noscript></main>
<footer class="fine">Salama gives information and screening, not a diagnosis. In an emergency call the police or emergency line, or go to the nearest health facility.

const CONTENT = {"lessons": [{"id": "sleep", "title": "Sleep when your schedule is not yours", "minutes": 2, "body": ["Short, steady sleep beats long, broken sleep. Aim for the same wake-up time as often as duty allows.", "Wind down for 20 minutes before sleep: dim your phone, put it face down, and slow your breathing (in for 4, out for 6).", "Limit caffeine after midday and avoid alcohol as a sleep aid. It helps you fall asleep but breaks up sleep later in the night.", "If you cannot sleep after 20 minutes, get up, sit somewhere dim and do something dull until you feel sleepy.", "Worry about money is a common reason for lost sleep. Write the worry and one next step on paper before bed.", "Trouble sleeping for more than 2 weeks, or nightmares that keep returning, is a good reason to talk to a nurse."]}, {"id": "stress", "title": "Reset in 90 seconds", "minutes": 2, "body": ["When stress spikes, slow your breathing: in through the nose for 4 counts, out through the mouth for 6. Repeat for 90 seconds.", "Name five things you can see, four you can touch, three you can hear. This pulls attention back to the present.", "Stress that is building for weeks needs a plan, not willpower: pick one problem, one person to tell and one next step.", "A reaction to a bad event is normal. If it is not easing after a month, or it is getting in the way of duty or home, ask a nurse."]}, {"id": "money", "title": "Debt: a one-page plan", "minutes": 3, "body": ["Debt feels heavier when it stays in your head. On one page, list who you owe, how much, the cost (interest or fees) and the due date.", "Put the most costly and most threatening debts first. Do not borrow from one lender to pay another. It usually makes the total grow faster.", "Ask the welfare officer, your SACCO or a financial counsellor about restructuring, stopping extra charges or a salary deduction plan. Say it before you miss a payment.", "Before you borrow, ask whether the lender is licensed or registered. Since December 2024 the Central Bank of Kenya oversees lenders that do not take deposits. Unregistered lenders are a warning sign.", "Keep every message, call log and receipt. If someone threatens you, shames you or contacts your relatives and colleagues, keep the evidence and report it to the police.", "Money worry is a health issue too. If it is affecting your sleep, mood or home, a nurse can help with that part."]}, {"id": "idcard", "title": "If a lender is holding your card", "minutes": 3, "body": ["A lender who holds your military ID, bank card or phone as security has power over you. You are not the first person this has happened to.", "Do not report a card as lost when a lender has it. A false report can turn a money problem into a discipline or criminal case, and the lender often still has the card.", "Do not give anyone your PIN or phone password. If a bank card is held, tell your bank at once so it can be blocked.", "Talk early to the welfare officer, the chaplain or the pilot nurse about how to get the card back safely and what rule applies in your unit.", "The pilot team has asked the Medical Services and the Ministry of Defence for a written no-penalty route for people who come forward on their own. Ask what is in force where you are. Do not assume it exists.", "If someone threatens you or your family, call the police and keep the messages."]}, {"id": "anger", "title": "Cooling off before home gets hurt", "minutes": 2, "body": ["Anger is a signal, not a command. The early signs are heat in the face, a tight jaw, a fast heartbeat and short answers.", "Agree a time-out word with your partner. Saying it means: I am leaving the room for 20 minutes and I will come back.", "Do not talk through a fight while drinking. Wait until you are sober and calm.", "Money fights are among the most common. Pick a calm time to look at the one-page debt plan together.", "If your anger or drinking has hurt or frightened someone at home, you can get help, and asking early protects your family amme with military discipline is a big change: early mornings, a heavy workload, clinical placements, and months away from home. Feeling the strain at the start is normal and common.", "Build three habits in the first two weeks: a steady sleep time, one person you talk to every week, and one hour that is only yours.", "Ask for help early. A short chat with a nurse, a chaplain or a lecturer in week three is far easier than a crisis in week twelve.", "Money problems are a common reason people leave. Tell the welfare office before you miss a payment, and do not borrow from lenders who keep your cards or ID.", "If you ever feel like leaving, talk to someone first. Many students who think of leaving stay once the problem is named and a plan is made."]}, {"id": "exams", "title": "Exam and placement stress", "minutes": 2, "body": ["Plan in blocks of 45 minutes with a 10 minute break. Sleep before a test helps more than another late hour of study.", "Before a clinical placement, ask your preceptor what a normal day looks like. Not knowing is a big part of the fear.", "A bad result is information, not a verdict. Ask the lecturer what to change and book the next step the same week.", "Racing heart, blank mind or constant dread before exams for more than two weeks is a good reason to talk to a nurse."]}, {"id": "homeplan", "title": "A safety plan for home", "minutes": 3, "body": ["A plan made on a calm day helps on a bad one. Decide where you can go, who you can call and what you would take.", "If you are afraid at home: keep important documents and a little money where you can reach them, and tell one trusted person.", "If you are worried you may hurt someone: agree a time-out word, leave the room before it builds, and ask a nurse for help early.", "In danger now: police 999 or 112; free gender-violence line 1195."]}], "buddy": {"title": "Check on a buddy", "steps": ["Look for changes: withdrawn, short-tempered, not sleeping, drinking more, giving things away, talking as if nothing matters, avoiding calls, suddenly short of money.", "Ask directly and privately: 'I have noticed you are not yourself. How are you really doing?'", "Listen without fixing. You do not need the right answer. You only need to stay.", "If they talk about suicide, ask plainly: 'Are you thinking of ending your life?' Asking does not put the idea in their head.", "If money is the weight, offer to go with them to the welfare officer. Do not lend more than you can lose, and do not take their cards.", "Do not leave them alone if they are in danger. Take them to the nurse or call for help straight away.", "Follow up in a few days. A second check matters as much as the first."]}, "navigator": [{"id": "money", "title": "Money or debt", "who": "Welfare officer or SACCO", "detail": "Ask about welfare funds, restructuring, stopping extra charges and salary deduction problems. Try the one-page debt plan lesson.", "lesson": "money"}, {"id": "lender", "title": "A lender is pressuring or threatening me", "who": "Police and welfare officer", "detail": "Keep messages and call logs. Threats and shaming are reportable. A welfare officer can help you plan repayment.", "lesson": "money"}, {"id": "idcard", "title": "A lender is holding my ID or bank card", "who": "Welfare officer, chaplain or pilot nurse", "detail": "Do not report it lost if it is not. Tell your bank to block a bank card. Ask what no-penalty route applies in your unit.", "lesson": "idcard"}, {"id": "housing", "title": "Housing or family welfare", "who": "Welfare officer", "detail": "Ask about housing allocation, school fees support and family welfare schemes."}, {"id": "home", "title": "Conflict at home", "who": "Chaplain or nurse counsellor", "detail": "A chaplain or counsellor can speak with you, or with both of you, in confidence.", "lesson": "homeplan"}, {"id": "safety", "title": "Safety at home", "who": "Emergency lines", "detail": "If someone is in danger now: police 999 or 112. Free gender-violence line 1195. Yo function toCSV(rows, cols) {

}

/* ---------- backends: demo (this browser only) and supabase ---------- */
const Demo = {
  db() { const d = Store.get("salama_demo_db", {}); for (const k of ["responses", "events", "service_requests", "college_sharing"]) d[k] = d[k] || []; return d; },
  save(d) { Store.set("salama_demo_db", d); }
};

const Api = {
  queue() { return Store.get("salama_queue", []); },
  pending() { return this.queue().length; },
  /* Add a row to the outgoing queue, then try to send straight away. Returns true if everything was sent. */
  async insert(table, row) {
    row = Object.assign({ client_uuid: Util.uuid() }, row);
    const q = this.queue(); q.push({ table, row }); Store.set("salama_queue", q);
    return this.flush();
  },
  async flush() {
    if (this._flushing) { this._again = true; return this.queue().length === 0; } this._flushing = true;
    try {
      const tried = new Set();
      do {
        this._again = false;
        for (const job of this.queue()) {
          if (tried.has(job.row.client_uuid)) continue; tried.add(job.row.client_uuid);
          let res = "retry"; try { res = await this._send(job.table, job.row); } catch (e) { res = "retry"; }
          if (res !== "retry") Store.set("salama_queue", this.queue().filter(j => j.row.client_uuid !== job.row.client_uuid));   // re-read, so items added meanwhile are never lost
        }
      } while (this._again || this.queue().some(j => !tried.has(j.row.client_uuid)));
      return this.queue().length === 0;
    } finally { this._flushing = false; }
  },
  /* returns "ok" | "drop" | "retry" */
  async _send(table, row) {
    if (CFG.BACKEND === "demo") {
      const d = Demo.db();
      if (!d[table].some(r => r.client_uuid === row.client_uuid))
        d[table].push(Object.assign({ id: Util.uuid(), created_at: new Date().toISOString() }, table === "service_requests" ? { status: "new" } : {}, row));
      Demo.save(d); return "ok";
    }
    if (CFG.BACKEND === "supabase") {
      if (!navigator.onLine) return "retry";
      const r = await fetch(`${CFG.SUPABASE_URL}/rest/v1/${table}`, {
        method: "POST", headers: { apikey: CFG.SUPABASE_ANON_KEY, Authorization: "Bearer " + CFG.SUPABASE_ANON_KEY, "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify(row) });
      if (r.status === 201 || r.status === 409) return "ok";                    // 409 = already stored (safe retry)
      if (r.status >= 400 && r.status < 500) { console.warn("Rejected by database", r.status, await r.text()); return "drop"; }
      return "retry";
    }
    return "drop";
  },
  async event(type, detail) {
    const p = Store.get("salama_profile", {}); if (!p.consentUsage) return;
    return this.insert("events", { anon_code: p.anon_code || null, unit_code: p.unit_code || null, event_type: type, detail: detail == null ? null : String(detail).slice(0, 40) });
  },
  async issueId(grp) {          // anonymous sequential participant ID, first come first served; null if offline or full (phone then makes a random one)
    try {
      if (CFG.BACKEND === "demo") { const d = Demo.db(); d.seq = d.seq || {}; const pf = { personnel: "PERS", family: "FAMI", applicant: "APPL" }[grp]; if (!pf) return null; d.seq[pf] = (d.seq[pf] || 0) + 1; Demo.save(d); return d.seq[pf] > 9999 ? null : pf + "-" + String(d.seq[pf]).padStart(4, "0"); }
      if (!navigator.onLine) return null;
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 4000);
      const r = await fetch(`${CFG.SUPABASE_URL}/rest/v1/rpc/issue_participant_id`, { method: "POST", signal: ctl.signal, headers: { apikey: CFG.SUPABASE_ANON_KEY, Authorization: "Bearer " + CFG.SUPABASE_ANON_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_grp: grp }) });
      clearTimeout(tm); if (!r.ok) return null; const v = await r.json(); return typeof v === "string" && /^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(v) ? v : null;
    } catch (e) { return null; }
  },
  async withdrawShare(uuid) {
    try {
      if (CFG.BACKEND === "demo") { const d = Demo.db(); const n = d.college_sharing.length; d.college_sharing = d.college_sharing.filter(x => x.client_uuid !== uuid); Demo.save(d); return d.college_sharing.length < n; }
      if (!navigator.onLine) return undefined;
      const r = await fetch(`${CFG.SUPABASE_URL}/rest/v1/rpc/withdraw_share`, { method: "POST", headers: { apikey: CFG.SUPABASE_ANON_KEY, Authorization: "Bearer " + CFG.SUPABASE_ANON_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_client_uuid: uuid }) });
      return r.ok ? await r.json() : undefined;
    } catch (e) { return undefined; }
  },
  async getTicket(ticket) {
    try {
      if (CFG.BACKEND === "demo") {
        const r = Demo.db().service_requests.find(x => x.ticket_code === ticket);
        return r ? { status: r.status, nurse_reply: r.nurse_reply || null, replied_at: r.replied_at || null } : null;
      }
      if (!navigator.onLine) return undefined;
      const r = await fetch(`${CFG.SUPABASE_URL}/rest/v1/rpc/get_ticket`, { method: "POST",
        headers: { apikey: CFG.SUPABASE_ANON_KEY, Authorization: "Bearer " + CFG.SUPABASE_ANON_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_ticket: ticket }) });
      if (!r.ok) return undefined; const j = await r.json(); return Array.isArray(j) ? (j[0] || null) : j;
    } catch (e) { return undefined; }
  }
};

views.guide = function () {
  Api.event("guide_opened", CFG.AI_ENDPOINT ? "ai" : "local");
  S.chat = S.chat || [];
  const ai = !!CFG.AI_ENDPOINT;
  $app.innerHTML = `<button class="back" data-go="helpHub">‹ Get help</button><h1>The guide</h1>
  <div class="card small"><b>What this is</b><p>${ai ? "An AI assistant. It can make mistakes, it is not a nurse or counsellor, and it cannot diagnose. What you type is sent to an AI service to get a reply, and is not stored by this app. Please do not type names, service numbers or lender details." : "A private guide that runs on your phone. Nothing you type leaves it. It points you to short lessons and to people who can help. It is not a clinician."}</p></div>
  <div id="chat" aria-live="polite"></div>
  <form id="gf" class="row" style="margin-top:10px"><input type="text" id="gi" maxlength="400" autocomplete="off" placeholder="Type what is on your mind" style="flex:3;min-width:0"><button class="btn" style="flex:1">Send</button></form>
  <p class="small muted">If you are in danger or thinking of ending your life, use <button class="link small" data-go="safety">help now</button>.</p>`;
  const chat = document.getElementById("chat");
  const bubble = (who, html) => { const d = document.createElement("div"); d.className = "card"; d.style.cssText = who === "me" ? "margin-left:24px;background:var(--brand-soft)" : "margin-right:24px"; d.innerHTML = html; chat.appendChild(d); d.scrollIntoView({ block: "end" }); return d; };
  const people = `<div class="row" style="margin-top:8px"><button class="btn secondary" data-go="callback" data-reason="mental_health">Talk to a nurse</button><button class="btn secondary" data-go="helpHub">More ways to get help</button></div>`;
  const hello = () => bubble("bot", `Hello. Tell me what is weighing on you, in a few words. For example: <i>I cannot sleep</i>, <i>I owe a lender</i>, <i>exam stress</i>, <i>fights at home</i>. I will point you to something short that helps, and to a person if you want one.`);
  if (!chat.children.length) hello();
  function reply(t) {
    if (CRISIS.test(t)) return `<b>I am glad you said that. You do not have to carry it alone.</b><p class="small">If you might act on these thoughts, please get help now.</p>${safetyBlock("Get help now")}<button class="btn block" data-go="callback" data-reason="mental_health">Ask a nurse to contact me today</button><p class="small muted">Please stay with someone you trust until you have spoken to a person.</p>`;
    if (DANGER.test(t)) return `<b>Your safety comes first.</b><p class="small">If someone is hurting or threatening you, call the police (999 or 112) or the free gender-violence line (1195), or go to the nearest health facility. A nurse can also help you plan next steps.</p>${safetyBlock("If you are not safe")}${people}`;
    const hit = TOPICS.filter(([re]) => re.test(t)).slice(0, 2);
    if (!hit.length) return `Thank you for telling me. I am not sure which topic fits. You can try one of these, or talk to a person.<ul class="clean">${["sleep", "stress", "money", "anger", "alcohol", "loss", "dchs_start"].map(id => { const l = lessonById(id); return l ? `<li><button class="link" data-go="lesson" data-id="${E(id)}">${E(l.title)}</button></li>` : ""; }).join("")}</ul>${people}`;
    return hit.map(([, id, name]) => { const l = lessonById(id); if (!l) return ""; return `<b>${E(name)}</b><p class="small">${E(l.body.slice(0, 2).join(" "))}</p><button class="link" data-go="lesson" data-id="${E(id)}">Read: ${E(l.title)}</button>`; }).join("<hr>") + `<p class="small muted">Feeling this for more than two weeks, or it is getting in the way of duty, studies or home? A nurse can help.</p>` + people;
  }
  document.getElementById("gf").onsubmit = async e => {
    e.preventDefault(); const inp = document.getElementById("gi"), t = inp.value.trim(); if (!t) return; inp.value = ""; bubble("me", E(t)); Api.event("guide_message", null);
    if (CRISIS.test(t) || DANGER.test(t) || !ai) { bubble("bot", reply(t)); return; }          // crisis wording never goes to an AI first: people first
    const wait = bubble("bot", '<span class="muted">Thinking...</span>'); S.chat.push({ role: "user", content: t }); S.chat = S.chat.slice(-8);
    try {
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 20000);
      const r = await fetch(CFG.AI_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: S.chat }), signal: ctl.signal }); clearTimeout(tm);
      if (!r.ok) throw new Error("x"); const j = await r.json(); const txt = String(j.reply || "").slice(0, 1500); if (!txt) throw new Error("x");
      S.chat.push({ role: "assistant", content: txt }); wait.innerHTML = E(txt).replace(/\n/g, "<br>") + people;
    } catch (er) { wait.innerHTML = reply(t); }                                                // if the AI is unreachable, fall back to the on-phone guide
  };
};

  <label class="opt"><input type="checkbox" id="simple" ${P.simple ? "checked" : ""}><span class="small">Simple view: show only the check-in, weekly pulse, get help, ask the nurse and money help.</span></label></div>
  <div class="card"><fieldset><legend>My unit group</legend><select id="unit">${CFG.UNITS.map(u => `<option value="${E(u.code)}" ${P.unit_code === u.code ? "selected" : ""}>${E(u.label)}</option>`).join("")}</select></fieldset>
  <label class="opt"><input type="checkbox" id="cU" ${P.consentUsage ? "checked" : ""}><span class="small">Share anonymous usage counts</span></label><div style="height:8px"></div>
  <label class="opt"><input type="checkbox" id="cA" ${P.consentAnswers ? "checked" : ""}><span class="small">Share my anonymous check-in and pulse answers for the pilot evaluation</span></label></div>
  ${P.share ? `<div class="card"><b>Colour shared with the college</b><p class="small">You shared: ${BAND_NAME[P.share.band]}. <button class="link small" id="wd2">Withdraw</button></p></div>` : ""}
  ${P.grp === "applicant" ? `<div class="card"><b>DCHS applicants and students</b><p class="small">After admission decisions are final, you can switch to the orientation check. It repeats the same questions when nothing depends on your answers.</p><button class="btn secondary block" id="toOri">I have been admitted: switch to the orientation check</button></div>` : ""}
  <div class="card"><b>Waiting to send</b><p class="small">${Api.pending()} item(s) waiting for a connection. <button class="link small" id="flush">Send now</button></p></div>
  <button class="btn danger block" id="wipe">Delete everything stored on this phone</button><p class="small muted">Version ${E(CFG.APP_VERSION)}, protocol ${E(CFG.PROTOCOL_VERSION)}. Data already sent cannot be linked back to you.</p>`;
  document.getElementById("unit").onchange = e => { P.unit_code = e.target.value; save(); Api.event("situation_changed", "unit"); };
  document.getElementById("sit").onchange = e => { P.situation = e.target.value; save(); Api.event("situation_changed", e.target.value || "unset"); };
  document.getElementById("rl").onchange = e => { const nv = e.target.value; if (nv !== P.grp) { P.grp = nv; if (nv !== "applicant") P.apContext = null; P.done = P.done || {}; save(); Api.event("role_changed", nv); } };
  document.getElementById("simple").onchange = e => { P.simple = e.target.checked; save(); };
  document.getElementById("cU").onchange = e => { P.consentUsage = e.target.checked; save(); };
  document.getElementById("cA").onchange = e => { P.consentAnswers = e.target.checked; save(); };
  const w2 = document.getElementById("wd2"); if (w2) w2.onclick = withdrawShare;
  const to = document.getElementById("toOri"); if (to) to.onclick = () => { P.apContext = "orientation"; save(); go("home"); };
  document.getElementById("flush").onclick = async () => { await Api.flush(); views.settings(); };
  document.getElementById("wipe").onclick = () => { if (confirm("Delete your code, drafts, saved requests and settings from this phone?")) { Object.keys(localStorage).filter(k => k.startsWith("salama_") && k !== "salama_demo_db").forEach(k => localStorage.removeItem(k)); P = null; location.href = location.pathname; } };
};

/* ================================================================== LIVING CONTENT + START */
async function loadRemote() {
  try { const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 2500); const r = await fetch("content.json?h=" + Math.floor(Date.now() / 36e5), { signal: ctl.signal, cache: "no-cache" }); clearTimeout(tm); if (r.ok) Store.set("salama_content", await r.json()); } catch (e) { }
  const j = Store.get("salama_content", null); if (!j) return;
  if (j.banner) REMOTE.banner = String(j.banner).slice(0, 200);
  if (Array.isArray(j.lessons)) j.lessons.forEach(l => { if (l && l.id && l.title && Array.isArray(l.body)) { const k = LESSONS.findIndex(x => x.id === l.id); const n = { id: String(l.id), title: String(l.title), minutes: Number(l.minutes) || 2, body: l.body.map(String) }; if (k >= 0) LESSONS[k] = n; else LESSONS.push(n); } });
  if (Array.isArray(j.contacts)) CFG.LOCAL_CONTACTS = j.contacts.filter(c => c && c.label);
}
(async function init() {
  if (CFG.BACKEND === "demo") document.getElementById("demo").hidden = false;
  const q = new URLSearchParams(location.search);
  if (P && P.hasProfile && q.get("unit") && CFG.UNITS.find(u => u.code === q.get("unit"))) { P.unit_code = q.get("unit"); save(); }
  try { if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js"); } catch (e) { }
  await loadRemote();
  const v = P && P.hasProfile ? "home" : "welcome"; history.replaceState({ v, p: {} }, ""); render({ v, p: {} }); Api.flush();
})();
window.__salama = { P: () => P, S, go };
</script>
